aid: before-brands
name: Before Brands
description: 'Before Brands, Inc. was a Menlo Park, California science-based food and
  nutrition company founded on Stanford allergy research by Dr. Kari Nadeau, best known
  for SpoonfulOne — a consumer early-allergen-introduction product line that blended
  sixteen commonly allergenic proteins into daily servings for infants and toddlers.
  Nestle Health Science took a minority stake plus ex-US licensing rights in 2019 and
  later absorbed the business outright. It was a consumer packaged goods company, not
  a software company: it never operated a developer program, published no API, SDK or
  webhook surface, and its own domain is now controlled by Nestle and no longer serves
  a site.'
